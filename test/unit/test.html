                                        ctx.fillText(data, bar.x, bar.y - 5);
                                    
                                    
                                    if(config.type === 'doughnut')
                                    {
                                        const radius = (bar.innerRadius + bar.outerRadius) / 2;
                                        const radial = (bar.startAngle + bar.endAngle) / 2;
